name: Pull Request Staging

on:
  pull_request:
    branches: ['master']

permissions: read-all

concurrency:
  group: staging
  cancel-in-progress: true

jobs:
  staging:
    name: Build and deploy staging
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install
        run: yarn --frozen-lockfile
      - name: Web Build
        run: yarn cloudflare-build
        env:
          CF_SPACE: ${{ secrets.CF_SPACE }}
          CF_KEY: ${{ secrets.CF_KEY }}
          AUTH0_CLIENT_SECRET: 'dummy_value'
          AUTH0_DOMAIN: 'dummy_value'
          AUTH0_CLIENT_ID: 'dummy_value'
          AUTH0_ADMIN_EMAIL: 'dummy_value'
          AUTH0_SECRET: 'dummy_value'
          NEXTJS_ENV: 'staging'
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AUTH_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply staging D1 migrations
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: yarn db:migrate:staging
        working-directory: ./packages/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AUTH_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Forked pull requests do not receive repository secrets, so they still
      # build above but cannot deploy into the shared staging environment.
      - name: Deploy staging Worker
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: yarn cloudflare-deploy:staging
        working-directory: ./packages/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AUTH_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}