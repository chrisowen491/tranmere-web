name: Web Deploy

on:
  push:
    branches: [master]
    paths:
      - 'packages/site/**'
      - 'packages/sql/migrations/**'
      - '.github/workflows/web.yml'

permissions: read-all

jobs:
  publish_site:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write
    name: Publish to Cloudflare Workers
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install
        run: yarn --frozen-lockfile
      - name: Test
        run: yarn workspace @tranmere-web/site test
      - name: Lint
        run: yarn workspace @tranmere-web/site lint
      - name: Validate D1 migrations
        run: yarn workspace @tranmere-web/sql migrations
      - name: Build
        run: yarn cloudflare-build
        env:
          CF_SPACE: ${{ secrets.CF_SPACE }}
          CF_KEY: ${{ secrets.CF_KEY }}
          AUTH0_CLIENT_SECRET: 'dummy_value'
          AUTH0_DOMAIN: 'dummy_value'
          AUTH0_CLIENT_ID: 'dummy_value'
          AUTH0_ADMIN_EMAIL: 'dummy_value'
          AUTH0_SECRET: 'dummy_value'
          NEXTJS_ENV: 'production'
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AUTH_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply production D1 migrations
        run: yarn db:migrate:production
        working-directory: ./packages/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AUTH_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - uses: chrnorm/deployment-action@500aa6a23c81ffa1acf71072aee3cfa2cc2e556a
        name: Create GitHub deployment
        id: deployment
        with:
          token: '${{ secrets.GITHUB_TOKEN }}'
          environment-url: https://www.tranmere-web.com
          environment: production
          description: 'Workers deployment'

      - name: Web Deploy
        run: yarn cloudflare-deploy
        working-directory: ./packages/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AUTH_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Run Binoculars
        uses: foo-software/binoculars-action@40b0a9d3f6242214723446d3835e203271ade291
        with:
          author: ${{ github.actor }}
          branch: ${{ github.ref }}
          enableComments: false
          minScore: 80
          urls: 'https://www.tranmere-web.com'
          sha: ${{ github.sha }}

      - name: Update deployment status (success)
        if: success()
        uses: chrnorm/deployment-status@6df8d036fd2fee9eb82936733953da1f8382b41e
        with:
          token: '${{ github.token }}'
          environment-url: https://www.tranmere-web.com
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: 'success'

      - name: Update deployment status (failure)
        if: failure()
        uses: chrnorm/deployment-status@6df8d036fd2fee9eb82936733953da1f8382b41e
        with:
          token: '${{ github.token }}'
          environment-url: https://www.tranmere-web.com
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: 'failure'
