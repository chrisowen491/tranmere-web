schema {
  query: Query
  mutation: Mutation
}

type Query {
  listTranmereWebHatTricks(filter: TableSimpleFilterInput, limit: Int, nextToken: String): TranmereWebHatTricksConnection
  getTranmereWebHatTricksById(Season: String!): TranmereWebHatTricks
}

type TranmereWebHatTricks {
  id: String!
  Player: String!
  Season: ID!
  Date: String!
  Opposition: String!
  Goals: Int!    
}

type TranmereWebHatTricksConnection {
  items: [TranmereWebHatTricks]
  nextToken: String
}


type Mutation {
}


input TableSimpleFilterInput {
  id: TableStringFilterInput
  name: TableStringFilterInput
}

input TableBooleanFilterInput {
  eq: Boolean
  ne: Boolean
}

input TableFloatFilterInput {
  between: [Float]
  contains: Float
  eq: Float
  ge: Float
  gt: Float
  le: Float
  lt: Float
  ne: Float
  notContains: Float
}

input TableIDFilterInput {
  beginsWith: ID
  between: [ID]
  contains: ID
  eq: ID
  ge: ID
  gt: ID
  le: ID
  lt: ID
  ne: ID
  notContains: ID
}

input TableIntFilterInput {
  between: [Int]
  contains: Int
  eq: Int
  ge: Int
  gt: Int
  le: Int
  lt: Int
  ne: Int
  notContains: Int
}

input TableStringFilterInput {
  beginsWith: String
  between: [String]
  contains: String
  eq: String
  ge: String
  gt: String
  le: String
  lt: String
  ne: String
  notContains: String
}